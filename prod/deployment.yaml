apiVersion: apps/v1
kind: Deployment
metadata:
  name: production-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: production-app
  template:
    metadata:
      labels:
        app: production-app
    spec:
      containers:
      - name: production-container
        image: europe-west1-docker.pkg.de*/qwiklabs-gcp-02-ea79d2368929/my-r*pository-eu/hello-cloudbuild-prod:*1.0
        ports:
        - containerPort: 8080
